[project]
name = "mnist-and-predictive-game"
version = "0.1.0"
description = "MNIST digit recognition and ML Fight player prediction neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x>=14.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
]
